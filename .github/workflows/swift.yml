name: Build iOS App (.ipa)

on:
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build Archive
        run: |
          xcodebuild -scheme "RetroPod" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath "$PWD/build/RetroPod.xcarchive" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/RetroPod.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r RetroPod.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroPod-ipa
          path: build/RetroPod.ipa
